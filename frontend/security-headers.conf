# En-têtes de sécurité du frontend.
#
# `helmet` ne protège que les réponses de l'API ; le HTML et le JavaScript
# sont servis par Nginx, et c'est là qu'une XSS s'exécuterait.
#
# Ce fichier est inclus dans CHAQUE bloc `location` qui déclare ses propres
# `add_header` : en nginx, un `add_header` dans un bloc enfant remplace ceux
# du parent au lieu de s'y ajouter. Sans cette répétition, les requêtes vers
# /assets/ et /index.html perdraient silencieusement tous ces en-têtes.

# `script-src 'self'` sans 'unsafe-inline' : c'est pourquoi l'initialisation
# du thème vit dans /theme-init.js plutôt qu'en ligne dans index.html.
# `style-src` autorise l'inline, requis par les attributs `style` de React et
# par l'import de Google Fonts ; une injection de style est bien moins grave
# qu'une injection de script.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# Empêche le navigateur de deviner un type MIME différent de celui déclaré,
# vecteur classique pour faire exécuter une image comme du script.
add_header X-Content-Type-Options "nosniff" always;

# `frame-ancestors` ci-dessus couvre les navigateurs récents ; celui-ci
# protège les plus anciens contre le détournement de clic.
add_header X-Frame-Options "DENY" always;

# Ne transmet le chemin complet qu'aux requêtes de même origine.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Aucune de ces interfaces n'est utilisée par l'application.
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
