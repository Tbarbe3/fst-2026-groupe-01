server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Masque la version de nginx dans l'en-tête Server.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Les assets Vite portent un hash dans leur nom : on peut les mettre en
    # cache agressivement, ils changent de nom à chaque build.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html ne doit jamais être mis en cache, sinon un navigateur
    # continue de demander les anciens assets après un déploiement.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Même traitement que index.html : ce script porte le thème initial et
    # doit refléter immédiatement un changement de déploiement.
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Les source maps rendent les erreurs de production lisibles, mais ne
    # servent qu'au débogage : inutile de les laisser en cache longue durée.
    location ~ \.map$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # --- RELAIS API BACKEND (Better Auth et routes API) ---
    location /api/ {
        # Si vous utilisez Docker Compose, remplacez par http://api:3000 (ou le nom de votre service backend)
        # Si tout tourne sur le même hôte sans conteneur séparé : http://127.0.0.1:3000
        proxy_pass http://api:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Augmente la taille max pour éviter les erreurs 413 sur les avatars
        client_max_body_size 5M;
    }

    # SPA : toute autre route renvoie vers React
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}