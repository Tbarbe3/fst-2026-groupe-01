server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les assets Vite portent un hash dans leur nom : on peut les mettre en
    # cache agressivement, ils changent de nom à chaque build.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html ne doit jamais être mis en cache, sinon un navigateur
    # continue de demander les anciens assets après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA : toute route inconnue (/dashboard, /review/42...) renvoie
    # index.html, c'est React Router qui décide ensuite.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
