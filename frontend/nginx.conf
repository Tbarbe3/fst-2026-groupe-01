server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Masque la version de nginx dans l'en-tête Server.
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Les assets Vite portent un hash dans leur nom : on peut les mettre en
    # cache agressivement, ils changent de nom à chaque build.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html ne doit jamais être mis en cache, sinon un navigateur
    # continue de demander les anciens assets après un déploiement.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Même traitement que index.html : ce script porte le thème initial et
    # doit refléter immédiatement un changement de déploiement.
    location = /theme-init.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Les source maps rendent les erreurs de production lisibles, mais ne
    # servent qu'au débogage : inutile de les laisser en cache longue durée.
    location ~ \.map$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # SPA : toute route inconnue (/dashboard, /review/42...) renvoie
    # index.html, c'est React Router qui décide ensuite.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
