# Déploiement VPS derrière Traefik.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Prérequis : le réseau `web` existe déjà (c'est celui du conteneur traefik)
# et l'enregistrement DNS de DOMAIN pointe sur le VPS.
#
# Les variables viennent d'un fichier .env placé à côté de ce compose
# (cf. .env.prod.example). Ne le commitez pas.
services:
  frontend:
    build:
      context: ./frontend
    image: codehow-frontend
    container_name: codehow-front
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.codehow.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.codehow.entrypoints=websecure"
      - "traefik.http.routers.codehow.tls.certresolver=le"
      - "traefik.http.services.codehow.loadbalancer.server.port=80"
    networks:
      - web

  backend:
    build:
      context: ./backend
    image: codehow-backend
    container_name: codehow-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CORS_ORIGIN: https://${DOMAIN}
    labels:
      - "traefik.enable=true"
      # Règle plus spécifique que celle du front : Traefik calcule la priorité
      # d'après la longueur de la règle, /api gagne donc sur `/`. On la fixe
      # explicitement pour que ça ne dépende pas de ce détail.
      - "traefik.http.routers.codehow-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.codehow-api.priority=100"
      - "traefik.http.routers.codehow-api.entrypoints=websecure"
      - "traefik.http.routers.codehow-api.tls.certresolver=le"
      - "traefik.http.services.codehow-api.loadbalancer.server.port=3000"
    networks:
      - web       # joignable par Traefik
      - internal  # joint Postgres
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: codehow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Volontairement absente du réseau `web` : la base n'a aucune raison
    # d'être joignable par les autres projets du VPS, ni par Traefik.
    networks:
      - internal

networks:
  web:
    external: true
  internal:
    driver: bridge

volumes:
  postgres-data:
